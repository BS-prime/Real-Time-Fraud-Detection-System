# hyperparams.yaml
models:
  LogisticRegression:
    type: "LogisticRegression"
    enabled: true
    params:
      penalty: [ "l1", "l2" ]
      C: [ 0.01, 0.1, 1.0, 10.0 ]
      solver: [ "liblinear" ]
      class_weight: [ "balanced" ]
      max_iter: [ 1000 ]
      n_jobs: [ -1 ]
  
  RandomForest:
    type: "RandomForestClassifier"
    enabled: true
    params:
      n_estimators: [ 500, 1000, 1500 ]
      class_weight: [ "balanced", "balanced_subsample" ]
      max_depth: [ 10, 15 ]
      min_samples_leaf: [ 10, 15 ]
      max_features: [ "sqrt", "log2" ]
      bootstrap: [ true ]
      n_jobs: [ -1 ]


  XGBoost:
    type: "XGBClassifier"
    enabled: true
    params:
      scale_pos_weight: [ 284.71 ]
      max_depth: [ 3, 6 ]
      min_child_weight: [ 10, 15 ]
      gamma: [ 1.5, 2.0 ]
      lambda: [ 2.0, 3.0 ]
      alpha: [ 0.5, 1.0 ]
      subsample: [ 0.7, 0.8, 0.9 ]
      colsample_bytree: [ 0.8 ]
      learning_rate: [ 0.01 ]
      n_estimators: [ 500, 1000, 1500 ]
      tree_method: [ 'approx', 'auto', 'exact', 'hist' ]
      
