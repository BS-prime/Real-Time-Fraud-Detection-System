[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud_detection"
version = "0.1.0"
description = "Beginner-friendly real-time fraud detection pipeline and API"
requires-python = ">=3.12"

dependencies = [
    "faker>=10.2.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.0",
    "shap>=0.44.0",
    "pydantic>=2.7.0",
    "evidently>=0.4.36,<0.5.0",
    "matplotlib>=3.8.0",
    "ipykernel >= 6.28.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]

dev = [
    "pytest>=7.4.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]

where = ["src"]
include = ["*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
